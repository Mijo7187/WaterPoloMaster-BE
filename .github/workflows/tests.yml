name: Tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest

    # Settings() requires these; tests use in-memory SQLite via conftest,
    # so the values are placeholders just to satisfy config validation.
    env:
      APP_ENV: testing
      DATABASE_URL: "sqlite:///./test.db"
      SECRET_KEY: "test-secret-key"

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest
